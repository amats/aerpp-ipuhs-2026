  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - "@playwright/test@1.64.1"
  - "@rolldown/binding-android-arm-eabi@1.2.14"
  - "@rolldown/binding-android-arm64@1.2.14"
  - "@rolldown/binding-darwin-arm64@1.2.14"
