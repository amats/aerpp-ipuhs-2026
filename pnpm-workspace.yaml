  "babel-plugin-react-compiler": "^1.0.0"
  "google-auth-library": "11.3.4"
  "iron-session": "9.1.0"
  "next": "^16.4.6"
  "pino": "^10.4.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "tailwindcss": "^4.3.5"
  "typescript": "^7.0.2"
