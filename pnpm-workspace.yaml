packages:
  - "apps/*"
  - "packages/*"
overrides:
  # GHSA-w5hq-g745-h8pq; retain CommonJS support for the Google HTTP client.
  "uuid@<11.1.1": "11.1.1"
allowBuilds:
  protobufjs: true
  sharp: true
# Shared dependencies and packages upgraded together. Single-owner dependencies
# stay in their package.json; keep pnpm's default manual catalog mode.
catalog:
  "@biomejs/biome": "2.5.15"
  "@google-cloud/firestore": "9.3.1"
  "@libpdf/core": "0.5.2"
  "@next/mdx": "^16.4.1"
  "@playwright/test": "^1.64.1"
  "@tailwindcss/postcss": "^4.3.3"
  "@types/node": "^24.19.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "babel-plugin-react-compiler": "^1.0.0"
  "google-auth-library": "11.3.1"
  "iron-session": "9.0.1"
  "next": "^16.4.1"
  "pino": "^10.4.0"
  "react": "^19.3.1"
  "react-dom": "^19.3.1"
  "tailwindcss": "^4.3.3"
  "typescript": "^7.0.2"
  "vitest": "^5.0.4"
  "zod": "^4.6.7"
patchedDependencies:
  "@libpdf/core@0.5.2": patches/@libpdf__core@0.5.2.patch
# Reviewed updates published within pnpm's default 24-hour release delay.
# Keep exceptions scoped to these exact versions.
minimumReleaseAgeExclude:
