[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

[FILTER]
    Name  modify
    Match docker.app-aerpp
    Add   service app-aerpp
    Add   container app-aerpp

[FILTER]
    Name         parser
    Match        docker.app-aerpp
    Key_Name     log
    Parser       app_json
    Reserve_Data On

[FILTER]
    Name  modify
    Match docker.caddy
    Add   service caddy
    Add   container caddy

[FILTER]
    Name         parser
    Match        docker.caddy
    Key_Name     log
    Parser       caddy_json
    Reserve_Data On

[OUTPUT]
    Name                        stackdriver
    Match                       docker.app-aerpp
    google_service_credentials  /fluent-bit/etc/gcp-credentials.json
    resource                    generic_node
    location                    ${GCP_LOGGING_LOCATION}
    namespace                   ${GCP_LOGGING_NAMESPACE}
    node_id                     ${PARTICIPANT_API_SERVER_ID}
    labels                      component=app-aerpp,stack=server-aerpp
    severity_key                severity
    labels_key                  logging.googleapis.com/labels

[OUTPUT]
    Name                        stackdriver
    Match                       docker.caddy
    google_service_credentials  /fluent-bit/etc/gcp-credentials.json
    resource                    generic_node
    location                    ${GCP_LOGGING_LOCATION}
    namespace                   ${GCP_LOGGING_NAMESPACE}
    node_id                     ${PARTICIPANT_API_SERVER_ID}
    labels                      component=caddy,stack=server-aerpp
    severity_key                level
    labels_key                  logging.googleapis.com/labels
